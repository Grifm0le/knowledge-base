[project]
name = "knowledge-base"
version = "0.1.0"
description = "Личная база знаний: импорт Markdown, скоринг релевантности и полнотекстовый поиск"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "markdown-it-py>=3.0",
    "PyYAML>=6.0",
    "snowballstemmer>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[project.scripts]
kb = "kb.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["kb"]
branch = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET"]
