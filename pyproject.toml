[project]
name = "knowledge-base"
version = "0.1.0"
description = "Личная база знаний: импорт Markdown, скоринг релевантности и полнотекстовый поиск"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "markdown-it-py>=3.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "PyYAML>=6.0",
    "redis>=5.0",
    "snowballstemmer>=2.2",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "fakeredis>=2.23",
    "httpx>=0.27",
    "matplotlib>=3.8",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "types-PyYAML",
]

[project.scripts]
kb = "kb.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "postgres: нужен настоящий PostgreSQL (KB_TEST_DATABASE_URL)",
    "redis: нужен настоящий Redis (KB_TEST_REDIS_URL)",
]

[tool.coverage.run]
source = ["kb"]
branch = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["snowballstemmer"]
ignore_missing_imports = true
