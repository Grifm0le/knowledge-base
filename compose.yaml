# Запуск: sh tools/init_env.sh && sh tools/make_cert.sh && docker compose --profile demo up -d --build
# База и Redis находятся во внутренней сети и не публикуют порты наружу.
name: knowledge-base

x-app: &app
  image: knowledge-base:0.2.0
  env_file: .env
  environment:
    KB_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    KB_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - backend

  redis:
    image: redis:8
    restart: unless-stopped
    # Кэш восстанавливается сам, поэтому на диск не пишется. При нехватке памяти вытесняются записи
    # со сроком жизни: номера поколений остаются, иначе выдача могла бы устареть.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - volatile-lru
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - backend

  # Образ тот же, что у app: его собирает служба app, скачивать его неоткуда.
  migrate:
    <<: *app
    pull_policy: never
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  app:
    <<: *app
    build:
      context: .
      target: runtime
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - backend
      - frontend

  proxy:
    image: nginx:1.29-alpine
    restart: unless-stopped
    environment:
      KB_HTTPS_PORT: ${KB_HTTPS_PORT:-8443}
    ports:
      - "${KB_HTTP_PORT:-8080}:80"
      - "${KB_HTTPS_PORT:-8443}:443"
    volumes:
      - ./deploy/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/proxy.inc:/etc/nginx/conf.d/proxy.inc:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - frontend

  # Почтовый сервер для проверки: принимает письма и показывает их на http://127.0.0.1:8025.
  # В работе вместо него указывается настоящий SMTP в KB_SMTP_HOST.
  mailpit:
    image: axllent/mailpit:v1.27
    profiles:
      - demo
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - backend
      - frontend

volumes:
  db_data:

networks:
  backend:
    internal: true
  frontend:
